{% extends "base.html" %}{% block content %}<h1>Пользователи</h1><table><tr><th>Telegram ID</th><th>Username</th><th>Имя</th><th>Баланс</th><th>Статус</th><th></th></tr>{% for u in users %}<tr><td>{{u.user_id}}</td><td>{{u.username or ""}}</td><td>{{u.full_name or ""}}</td><td>{{"%.2f"|format(u.balance)}} ₽</td><td>{{"Активен" if u.is_active else "Заблокирован"}}</td><td><form method="post" action="/users/{{u.user_id}}/toggle"><button class="btn {{'danger' if u.is_active else ''}}">{{"Заблокировать" if u.is_active else "Включить"}}</button></form></td></tr>{% endfor %}</table>{% endblock %}
