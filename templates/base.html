<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}VPN Bot Panel{% endblock %}</title><style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#222}.nav{background:#1f2937;color:#fff;padding:14px 24px;display:flex;gap:18px;align-items:center}.nav a{color:#fff;text-decoration:none}.nav form{margin:0}.wrap{max-width:1200px;margin:24px auto;padding:0 16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.card,table{background:#fff;border-radius:10px;padding:18px;box-shadow:0 1px 5px #0001}table{width:100%;border-collapse:collapse;padding:0}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}.btn{padding:7px 12px;border:0;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer}.danger{background:#dc2626}.flash{padding:10px;margin:10px 0;border-radius:6px;background:#dbeafe}.error{background:#fee2e2}.success{background:#dcfce7}input{padding:10px;width:100%;box-sizing:border-box;margin:6px 0 14px}form.login{max-width:400px;margin:80px auto;background:#fff;padding:24px;border-radius:12px}</style></head><body>
<div class="nav"><b>VPN Bot Panel</b>{% if current_user_id %}<a href="/">Главная</a><a href="/admin">Админка</a><form method="post" action="/logout"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><button class="btn danger" type="submit">Выйти</button></form>{% endif %}</div><div class="wrap">
{% block content %}{% endblock %}</div></body></html>
