{% extends "base.html" %}{% block content %}<h1>Платежи</h1><table><tr><th>ID</th><th>User</th><th>Сумма</th><th>Метод</th><th>Статус</th><th>Дата</th></tr>{% for p in payments %}<tr><td>{{p.id}}</td><td>{{p.username or p.user_id}}</td><td>{{p.amount}} {{p.currency}}</td><td>{{p.payment_method or ""}}</td><td>{{p.status}}</td><td>{{p.payment_date}}</td></tr>{% endfor %}</table>{% endblock %}
