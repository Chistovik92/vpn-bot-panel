{% extends "base.html" %}{% block content %}<h1>Услуги</h1><table><tr><th>Название</th><th>Описание</th><th>Цена</th><th>Дней</th><th>Статус</th><th></th></tr>{% for s in services %}<tr><td>{{s.name}}</td><td>{{s.description}}</td><td>{{s.price}} ₽</td><td>{{s.duration_days}}</td><td>{{"Активна" if s.is_active else "Выключена"}}</td><td><form method="post" action="/services/{{s.id}}/toggle"><button class="btn">{{"Выключить" if s.is_active else "Включить"}}</button></form></td></tr>{% endfor %}</table>{% endblock %}
